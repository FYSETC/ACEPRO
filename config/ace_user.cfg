
#TUNE ME
[gcode_macro FLUSH_POOP]
gcode:
    {action_respond_info("BunnyACE POOP")}
    G90
    G1 Y288 F8000
    G1 X288 Y288 F8000
    G1 Z1 F1000
    G1 E50.0 F300
    G1 E50.0 F300
    # G1 E50.0 F300
    # G1 E50.0 F300
    G1 X240 Y288 F5000
    G1 X288 Y288 F5000
    G1 Z10 F1000



[gcode_macro CUT_TIP]
gcode:
    {% set pin_x = 40.0 %}
    {% set pin_y = 57.0 %}
    {% set cut_x = 9.2 %}
    {% set cut_y = 57.0 %}
    {% set z_hop = 10.0 %}
    {% set travel_speed = 3000 %}
    {% set cut_speed = 500 %}

    {action_respond_info("UNLOAD_FILAMENT phase=cut")}
    # SAVE_GCODE_STATE NAME=BMCU_PRINT_POS
    # SET_GCODE_VARIABLE MACRO=UNLOAD_FILAMENT VARIABLE=saved_pos VALUE=1
    G90
    G91
    G1 Z{z_hop} F600
    G90
    G1 X{pin_x} Y{pin_y} F{travel_speed}
    G1 X{cut_x} Y{cut_y} F{cut_speed}
    M400
    G4 P1000
    G1 X{pin_x} Y{pin_y} F{travel_speed}
    M400

[gcode_macro TO_THROW_POSITION]
gcode:
    G4 P100

[gcode_macro RESUME_NOZZLE_WIPE_SEQUENCE]
gcode:
    G4 P100

# Voron 350 startup. Slicer start G-code:
# G9111 bedTemp=[first_layer_bed_temperature] extruderTemp=[first_layer_temperature[initial_tool]] tool=[initial_tool] SKIP_PURGE_FOR_ALREADY_LOADED_TOOL=1
# do_qgl: 1 = QUAD_GANTRY_LEVEL (or Z_TILT_ADJUST) after G28
# limit_probe_temp: 1 only for a nozzle-contact probe that must stay cool (Cartographer)
[gcode_macro G9111]
description: "Voron 350 start: G9111 BEDTEMP= EXTRUDERTEMP= [TOOL=] [SKIP_PURGE_FOR_ALREADY_LOADED_TOOL=0|1]"
variable_do_qgl: 1
variable_limit_probe_temp: 0
variable_probing_temp: 150
variable_purge_start_x: 100.0
variable_purge_start_y: 15.0
variable_purge_end_x: 140.0
variable_purge_z: 0.28
variable_purge_e: 30.0
gcode:
  {% set bed_raw = (params.BEDTEMP | default(params.S) | default("60")) | string %}
  {% set noz_raw = (params.EXTRUDERTEMP | default(params.T) | default("200")) | string %}
  {% set ace_pin_defined = printer["output_pin ACE_Pro"] is defined %}
  {% set ace_pin_enabled = (ace_pin_defined and (printer["output_pin ACE_Pro"].value | float > 0.5)) %}
  {% set has_tool_param = ('TOOL' in params) or ('tool' in params) %}
  {% if ace_pin_enabled and not has_tool_param %}
    { action_raise_error("G9111: Missing required TOOL parameter. Use TOOL=[initial_tool]") }
  {% endif %}
  {% if has_tool_param %}
    {% set TOOL = ((params.TOOL | default(params.tool) | string | replace('=', '', 1)) | int) %}
  {% else %}
    {% set TOOL = 0 %}
  {% endif %}
  {% if TOOL < 0 %}
    { action_raise_error("G9111: Invalid TOOL=%d. TOOL must be >= 0." % TOOL) }
  {% endif %}
  {% set _skip_raw =
      (params.SKIP_PURGE_FOR_ALREADY_LOADED_TOOL
       | default(params.skip_purge_for_already_loaded_tool)
       | default("0")) | string
  %}
  {% set _skip_raw = (_skip_raw | trim | replace('=', '', 1) | lower) %}
  {% set SKIP_PURGE = (1 if _skip_raw in ['1','true','yes','on'] else 0) %}

  {% set BEDTEMP = (bed_raw | replace('=', '', 1)) | float %}
  {% set EXTRUDERTEMP = (noz_raw | replace('=', '', 1)) | float %}
  {% set PROBING_TEMP = printer["gcode_macro G9111"].probing_temp | float %}
  {% set limit_probe = printer["gcode_macro G9111"].limit_probe_temp | int %}

  { action_respond_info("G9111: bed=%.1f°C nozzle=%.1f°C tool=%d" % (BEDTEMP, EXTRUDERTEMP, TOOL)) }

  {% if printer["gcode_macro _ACE_STATE"] is defined %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=startup_toolchange VALUE=1
  {% endif %}

  {% set local_skip_purge = False %}
  {% if SKIP_PURGE %}
    {% if printer.save_variables is defined and printer.save_variables.variables is defined %}
      {% set ace_index = printer.save_variables.variables.ace_current_index|default(-1)|int %}
      {% set filament_pos = printer.save_variables.variables.ace_filament_pos|default('none') %}
    {% else %}
      {% set ace_index = -1 %}
      {% set filament_pos = 'none' %}
    {% endif %}
    {% set is_physically_loaded = False %}
    {% if "filament_switch_sensor filament_runout_nozzle" in printer.configfile.settings %}
      {% set is_physically_loaded = printer["filament_switch_sensor filament_runout_nozzle"].filament_detected %}
    {% endif %}
    {% if TOOL == ace_index and filament_pos == 'nozzle' and is_physically_loaded %}
      {% set local_skip_purge = True %}
      { action_respond_info("G9111: Tool %d already loaded. Bed purge skipped." % TOOL) }
    {% else %}
      { action_respond_info("G9111: Load T%d (saved tool %d, pos %s, sensor %s)" % (TOOL, ace_index, filament_pos, is_physically_loaded)) }
    {% endif %}
  {% endif %}

  M140 S{BEDTEMP}
  {% if limit_probe %}
    M104 S{PROBING_TEMP}
    {% if printer.extruder.temperature > (PROBING_TEMP + 2) %}
      { action_respond_info("G9111: cooling nozzle to %.0f°C before probe" % PROBING_TEMP) }
      TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={PROBING_TEMP}
    {% endif %}
  {% endif %}

  G28
  M190 S{BEDTEMP}

  {% if printer["gcode_macro G9111"].do_qgl|int == 1 %}
    {% if printer["gcode_macro QUAD_GANTRY_LEVEL"] is defined %}
      QUAD_GANTRY_LEVEL
      G28 Z
    {% elif printer["gcode_macro Z_TILT_ADJUST"] is defined %}
      Z_TILT_ADJUST
      G28 Z
    {% else %}
      { action_respond_info("G9111: no QUAD_GANTRY_LEVEL or Z_TILT_ADJUST, skipping gantry level") }
    {% endif %}
  {% endif %}

  {% if 'bed_mesh' in printer %}
    {% set bed_int = BEDTEMP|int %}
    {% set MESH_NAME = "BED_" ~ bed_int %}
    {% if printer.bed_mesh.profiles[MESH_NAME] is defined %}
      BED_MESH_PROFILE LOAD={MESH_NAME}
    {% elif printer.bed_mesh.profiles["default"] is defined %}
      BED_MESH_PROFILE LOAD=default
    {% else %}
      BED_MESH_CALIBRATE
    {% endif %}
  {% endif %}

  {% if printer["gcode_macro _ACE_STATE"] is defined %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=startup_toolchange VALUE=1
  {% endif %}

  TO_THROW_POSITION
  M109 S{EXTRUDERTEMP}
  {% if ace_pin_enabled %}
    T{TOOL}
    M400
  {% endif %}

  {% if not local_skip_purge %}
    {% set sx = printer["gcode_macro G9111"].purge_start_x | float %}
    {% set sy = printer["gcode_macro G9111"].purge_start_y | float %}
    {% set ex = printer["gcode_macro G9111"].purge_end_x | float %}
    {% set pz = printer["gcode_macro G9111"].purge_z | float %}
    {% set pe = printer["gcode_macro G9111"].purge_e | float %}
    G90
    G1 Z5 F3000
    G1 X{sx} Y{sy} F12000
    G1 Z{pz} F1000
    M83
    G92 E0
    G1 X{ex} E{pe} F1200
    G92 E0
    G1 Z5 F3000
  {% endif %}

  {% if printer["gcode_macro _ACE_STATE"] is defined %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=startup_toolchange VALUE=0
  {% endif %}
  { action_respond_info("G9111 complete.") }

# Slicer change-filament G-code: MMU_CHANGE_TOOL TOOL=[next_extruder]
# Optional PURGELENGTH= is applied before the tool change.
[gcode_macro MMU_CHANGE_TOOL]
description: "Change ACE channel. TOOL=<n> or T=<n> [PURGELENGTH=<mm>] [PURGESPEED=<mm/min>]"
gcode:
  {% set has_tool = ('TOOL' in params) or ('T' in params) %}
  {% if not has_tool %}
    { action_raise_error("MMU_CHANGE_TOOL: missing TOOL. Use TOOL=[next_extruder]") }
  {% endif %}
  {% set tool = ((params.TOOL | default(params.T) | string | replace('=', '', 1)) | int) %}
  {% if tool < 0 %}
    { action_raise_error("MMU_CHANGE_TOOL: invalid TOOL=%d" % tool) }
  {% endif %}
  {% if 'PURGELENGTH' in params or 'PURGE_LENGTH' in params %}
    {% set plen = (params.PURGELENGTH | default(params.PURGE_LENGTH) | string | replace('=', '', 1)) | float %}
    {% set pspd = (params.PURGESPEED | default(params.PURGE_SPEED) | default("300") | string | replace('=', '', 1)) | float %}
    ACE_SET_PURGE_AMOUNT PURGELENGTH={plen} PURGESPEED={pspd}
  {% endif %}
  { action_respond_info("MMU_CHANGE_TOOL: T%d" % tool) }
  T{tool}

[gcode_macro MMU_CHANGE_TOOL_STANDALONE]
description: "Same as MMU_CHANGE_TOOL. Some slicer profiles emit this name."
gcode:
  MMU_CHANGE_TOOL {rawparams}